<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>HandoverIQ • Knowledge Continuity</title><style>
:root{font-family:Inter,ui-sans-serif,system-ui,-apple-system,"Segoe UI",sans-serif;color:#e6ecf6;background:#0b1325}*{box-sizing:border-box}body{margin:0}button,input,select,textarea{font:inherit}button{border:0;border-radius:10px;background:#27bba5;color:#052820;padding:11px 16px;font-weight:700;cursor:pointer}button:hover{filter:brightness(1.09)}button:disabled{opacity:.5;cursor:not-allowed}.ghost{background:#202d43;color:#dfe7f4}.danger{background:#69323c;color:#fce5e8}.layout{display:grid;grid-template-columns:240px 1fr;min-height:100vh}aside{background:#0d172b;border-right:1px solid #273750;padding:24px 16px;display:flex;flex-direction:column;gap:12px}.logo{font-size:25px;font-weight:800;letter-spacing:-1px;color:white}.logo span{color:#32d3b7}small,.muted{color:#9aabc3}.nav{display:grid;gap:7px;margin-top:30px}.nav button{background:transparent;color:#b7c7df;text-align:left;padding:13px}.nav button.active{background:#1d3244;color:#5cf1d5}.footer{margin-top:auto;border-top:1px solid #2b3b54;padding-top:14px;font-size:13px}.wrap{max-width:1150px;margin:auto;padding:40px 35px}header{display:flex;justify-content:space-between;align-items:center;gap:20px;margin-bottom:27px}h1{font-size:30px;margin:0 0 8px}h2{font-size:20px;margin:0 0 15px}h3{margin:0 0 8px}p{line-height:1.6}.grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(270px,1fr));gap:16px}.panel{background:#152238;border:1px solid #2b3d55;border-radius:16px;padding:23px;margin:0 0 18px}.stat{font-size:38px;font-weight:800;color:#5cf1d5}.badge{display:inline-block;border-radius:50px;padding:5px 10px;background:#203d46;color:#83f6e6;font-size:12px;font-weight:700}.item{padding:14px 0;border-bottom:1px solid #2b3a51}.item:last-child{border:0}.label{display:block;font-size:13px;color:#b1bfd2;margin:12px 0 6px}input,textarea,select{width:100%;background:#0d192d;border:1px solid #354964;color:#eef5ff;border-radius:10px;padding:11px}textarea{min-height:90px;resize:vertical}pre{white-space:pre-wrap;overflow-wrap:anywhere;font-family:inherit;line-height:1.55}.actions{display:flex;flex-wrap:wrap;gap:9px;margin-top:12px}.notice{margin:10px 0;padding:12px;border-radius:10px;border:1px solid #36577b;background:#182a44;color:#d8edff}.error{background:#43242c;border-color:#884958;color:#ffe5eb}.chatbox{min-height:360px;max-height:65vh;overflow:auto;background:#101e32;border:1px solid #2b3b53;border-radius:14px;padding:20px;margin-bottom:12px}.bubble{border-radius:13px;padding:12px 16px;margin:10px 0;line-height:1.55;white-space:pre-wrap}.bubble.user{background:#24475b;margin-left:20%;}.bubble.bot{background:#223046;margin-right:12%}.cite{background:#0e2030;padding:7px 10px;color:#b5ecdf;border-radius:8px;margin:7px 0;font-size:13px;cursor:pointer}.login{max-width:430px;margin:11vh auto;padding:30px}.login .logo{font-size:33px}.sourcebody{max-height:400px;overflow:auto;white-space:pre-wrap;font:13px/1.7 monospace;background:#0b192c;padding:15px;border-radius:10px}.row{display:flex;gap:12px;align-items:center;flex-wrap:wrap}.row>*{flex:1}code{color:#92f5de}a{color:#64e0cd}@media(max-width:720px){.layout{grid-template-columns:1fr}aside{padding:12px;flex-direction:row;flex-wrap:wrap;align-items:center}.nav{display:flex;flex-wrap:wrap;margin:0}.nav button{padding:8px}.footer{display:none}.wrap{padding:24px 16px}header{display:block}}
</style></head><body><div id="root"></div><script>
const root=document.getElementById('root');let token=sessionStorage.getItem('token')||'',user=null,page='overview',docs=[],handovers=[],chatHistory=[],selected=null;
const esc=s=>String(s??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
async function api(path,method='GET',body){let opts={method,headers:{}};if(token)opts.headers.Authorization='Bearer '+token;if(body instanceof FormData)opts.body=body;else if(body!==undefined){opts.headers['Content-Type']='application/json';opts.body=JSON.stringify(body)}let controller=new AbortController();opts.signal=controller.signal;let timer=setTimeout(()=>controller.abort(),45000);let r;try{r=await fetch('/api'+path,opts)}finally{clearTimeout(timer)}let v=await r.json().catch(()=>({detail:'Request failed'}));if(!r.ok)throw Error(typeof v.detail==='string'?v.detail:JSON.stringify(v.detail));return v}
function msg(t,bad=false){let n=document.getElementById('alert');if(n){n.innerHTML='<div class="notice '+(bad?'error':'')+'">'+esc(t)+'</div>';n.scrollIntoView({block:'nearest'})}}
async function login(e){e.preventDefault();try{let v=await api('/login','POST',{username:document.querySelector('#username').value,password:document.querySelector('#password').value});token=v.token;user=v.user;sessionStorage.setItem('token',token);await refresh();render()}catch(e){msg(e.message,true)}}
function signout(){sessionStorage.removeItem('token');token='';user=null;render()}
function loginView(){root.innerHTML='<div class="login panel"><div class="logo">Handover<span>IQ</span></div><p class="muted">Evidence-first AI Knowledge Continuity Platform</p><div id="alert"></div><form onsubmit="login(event)"><label class="label">Username</label><input id="username" placeholder="lead / reviewer / newmember" required><label class="label">Password</label><input id="password" type="password" required><div class="actions"><button style="width:100%">Sign in</button></div></form><p class="muted">Demo roles: lead, reviewer, newmember. Ask your administrator for the configured demo password.</p></div>'}
async function refresh(){try{[docs,handovers]=await Promise.all([api('/sources'),api('/handovers')])}catch(e){if(e.message.includes('Session'))signout();else throw e}}
async function go(p){page=p;selected=null;try{await refresh()}catch(e){msg(e.message,true)}render()}
function render(){if(!user){loginView();return}root.innerHTML='<div class="layout"><aside><div class="logo">Handover<span>IQ</span></div><small>KNOWLEDGE CONTINUITY</small><div class="nav">'+[['overview','◈ Dashboard'],['sources','▤ Documents'],['chat','◇ AI Assistant'],['handovers','◫ Handovers'],['decisions','◎ Decision Timeline'],['onboarding','↗ Onboarding']].map(([id,label])=>'<button class="'+(page===id?'active':'')+'" onclick="go(\''+id+'\')">'+label+'</button>').join('')+'</div><div class="footer">'+esc(user.username)+' · '+esc(user.role)+'<div class="actions"><button class="ghost" onclick="signout()">Sign out</button></div></div></aside><main><div class="wrap"><header><div><h1>'+({overview:'Project Overview',sources:'Project Sources',chat:'Document AI Assistant',handovers:'Evidence-Based Handovers',onboarding:'Continuation Plan',decisions:'Decision Timeline'}[page])+'</h1><small>Reconstruct → Verify → Approve → Continue</small></div><span class="badge">'+esc(user.role.toUpperCase())+'</span></header><div id="alert"></div><div id="content"></div></div></main></div>';({overview:overview,sources:sourcePage,chat:chatPage,handovers:handoverPage,onboarding:onboardingPage,decisions:decisionPage}[page])()}
function overview(){document.querySelector('#content').innerHTML='<div class="grid"><div class="panel"><h3>Uploaded sources</h3><div class="stat">'+docs.length+'</div><small>Documents accessible to your role</small></div><div class="panel"><h3>Project handovers</h3><div class="stat">'+handovers.length+'</div><small>Visible handover records</small></div><div class="panel"><h3>Approved</h3><div class="stat">'+handovers.filter(h=>h.status==='approved').length+'</div><small>Ready for continuation</small></div></div><div class="panel" id="readiness"><h2>Continuity Readiness Index</h2><p class="muted">Evaluating available evidence...</p></div><div class="panel"><h2>Preserve project knowledge</h2><p>Upload authorized documents, ask questions using Gemini, extract evidenced decisions and open tasks, review every claim and provide a role-specific plan to the incoming member.</p><div class="actions"><button onclick="go(\'sources\')">Manage documents</button><button class="ghost" onclick="go(\'chat\')">Ask AI assistant</button></div></div><div class="notice">Production data uses PostgreSQL. Upload only authorized, non-sensitive project documents.</div>';showReadiness()}
async function showReadiness(){let el=document.getElementById('readiness');if(!el)return;try{let r=await api('/continuity/score');if(!document.contains(el))return;el.innerHTML='<h2>Continuity Readiness Index</h2><div class="stat">'+r.score+'<small>/100</small></div><p class="muted">'+esc(r.method)+'</p><div class="grid">'+Object.entries(r.components).map(([key,value])=>'<div><b>'+esc(key.replaceAll('_',' '))+'</b><p>'+value+' points</p></div>').join('')+'</div><p>'+r.claims+' supported claims · '+r.open_questions+' unresolved questions</p><button class="ghost" onclick="go(\'decisions\')">Explore decisions and gaps</button>'}catch(e){el.innerHTML='<h2>Continuity Readiness Index</h2><p class="muted">Unable to calculate: '+esc(e.message)+'</p>'}}
function sourcePage(){let editing=user.role!=='incoming';document.querySelector('#content').innerHTML=(editing?'<div class="panel"><h2>Upload a project source</h2><form onsubmit="upload(event)"><label class="label">Document · PDF, DOCX, TXT, MD · up to 2 MB</label><input id="file" type="file" accept=".pdf,.docx,.txt,.md" required><label class="label">Visibility</label><select id="visibility"><option value="all">Shared with incoming members</option><option value="restricted">Lead/reviewer only</option></select><div class="actions"><button>Upload document</button></div></form></div>':'')+'<div class="panel"><h2>Accessible documents</h2>'+(docs.length?docs.map(x=>'<div class="item"><b>'+esc(x.filename)+'</b> <span class="badge">'+esc(x.visibility)+'</span><div class="muted">'+x.length+' characters</div><div class="actions"><button class="ghost" onclick="viewSource('+x.id+')">Open source lines</button>'+(editing?'<button class="ghost" onclick="indexSource('+x.id+')">Build semantic index</button><button class="danger" onclick="delSource('+x.id+')">Delete</button>':'')+'</div></div>').join(''):'<p>No documents available to your role.</p>')+'</div><div id="details"></div>'}
async function upload(e){e.preventDefault();let submit=e.target.querySelector('button');if(submit.disabled)return;submit.disabled=true;let f=new FormData();f.append('file',document.querySelector('#file').files[0]);f.append('visibility',document.querySelector('#visibility').value);try{let result=await api('/sources','POST',f);await go('sources');msg(result.storage_warning||'Document uploaded')}catch(e){msg(e.message,true)}finally{if(document.contains(submit))submit.disabled=false}}
async function delSource(id){if(!confirm('Delete this document?'))return;try{await api('/sources/'+id,'DELETE');await go('sources')}catch(e){msg(e.message,true)}}
async function viewSource(id){try{let s=await api('/sources/'+id);document.querySelector('#details').innerHTML='<div class="panel"><h2>'+esc(s.filename)+'</h2><div class="sourcebody">'+s.lines.map(x=>esc(x.line+': '+x.text)).join('\n')+'</div></div>';document.querySelector('#details').scrollIntoView()}catch(e){msg(e.message,true)}}
function chatPage(){document.querySelector('#content').innerHTML='<div class="panel"><h2>Ask your uploaded documents</h2><p class="muted">Answers are grounded in excerpts you are permitted to read. Verify the cited sources before acting.</p><div id="conversation" class="chatbox"></div><form onsubmit="ask(event)"><textarea id="question" placeholder="What decisions were made? Who owns the next action?" required></textarea><div class="actions"><select id="chatengine" style="max-width:230px"><option value="auto">Ollama / Gemini / search fallback</option><option value="ollama">Ollama only</option><option value="gemini">Gemini only</option><option value="search">Search excerpts only</option></select><button id="askbtn">Ask assistant</button></div></form></div>';drawChat()}
function drawChat(){let el=document.querySelector('#conversation');if(!el)return;el.innerHTML=chatHistory.length?chatHistory.map(x=>'<div class="bubble '+x.kind+'">'+esc(x.text)+'</div>'+(x.citations||[]).map(c=>'<div class="cite" onclick="go(\'sources\').then(()=>viewSource('+c.source_id+'))">📄 '+esc(c.source_name)+' · line '+c.line+': '+esc(c.excerpt.slice(0,160))+'</div>').join('')).join(''):'<p class="muted">Ask a question to begin. Try: “What blockers remain?”</p>';el.scrollTop=el.scrollHeight}
async function ask(e){e.preventDefault();let question=document.querySelector('#question').value.trim(),engine=document.querySelector('#chatengine').value;if(!question)return;chatHistory.push({kind:'user',text:question});drawChat();document.querySelector('#askbtn').disabled=true;try{let r=await api('/chat','POST',{question,engine});chatHistory.push({kind:'bot',text:r.answer,citations:r.citations})}catch(err){chatHistory.push({kind:'bot',text:'Error: '+err.message})}document.querySelector('#askbtn').disabled=false;document.querySelector('#question').value='';drawChat()}
function handoverPage(){let editing=user.role!=='incoming';document.querySelector('#content').innerHTML=(editing?'<div class="panel"><h2>Create handover snapshot</h2><p>Claims are source-linked, rule-extracted and require human review. Cloud Gemini is available in the document assistant.</p><div class="actions"><select id="role" style="max-width:230px"><option value="incoming">Incoming member</option><option value="reviewer">Reviewer</option></select><button onclick="build()">Generate snapshot</button></div></div>':'')+'<div class="panel"><h2>Handover records</h2>'+(handovers.length?handovers.map(h=>'<div class="item"><b>Handover #'+h.id+'</b> <span class="badge">'+esc(h.status)+'</span><p class="muted">Recipient: '+esc(h.recipient_role)+'</p><button class="ghost" onclick="viewHandover('+h.id+')">Inspect handover</button></div>').join(''):'<p>No handovers yet.</p>')+'</div><div id="handoverDetails"></div>'}
async function build(){try{let r=await api('/handovers','POST',{recipient_role:document.querySelector('#role').value,engine:'rules'});await go('handovers');await viewHandover(r.id);msg('Snapshot created. Review all claims before approval.')}catch(e){msg(e.message,true)}}
async function viewHandover(id){try{let h=await api('/handovers/'+id);selected=h;let el=document.querySelector('#handoverDetails');if(!el){page='handovers';render();el=document.querySelector('#handoverDetails')}let edit=user.role!=='incoming',draft=h.status==='draft';el.innerHTML='<div class="panel"><h2>Handover #'+id+' · '+esc(h.status)+'</h2><h3>Evidence-linked claims</h3>'+(h.claims.length?h.claims.map(c=>'<div class="item"><span class="badge">'+esc(c.category)+'</span><p>'+esc(c.review?.correction&&c.review.verdict==='correct'?c.review.correction:c.text)+'</p><small>Source: '+esc(c.source_name)+' · line '+c.source_line+'</small><div class="actions"><button class="ghost" onclick="go(\'sources\').then(()=>viewSource('+c.source_id+'))">Inspect evidence</button></div>'+(edit&&draft?'<div class="actions"><button onclick="reviewClaim('+id+','+c.claim_id+',\'accept\')">Accept</button><button class="ghost" onclick="reviewClaim('+id+','+c.claim_id+',\'correct\')">Correct</button><button class="danger" onclick="reviewClaim('+id+','+c.claim_id+',\'reject\')">Reject</button></div>':'')+'<small>Review: '+esc(c.review?.verdict||'pending')+'</small></div>').join(''):'<p>No evidence-backed claims. Add substantive source notes.</p>')+'<h3>Knowledge gaps</h3>'+h.gaps.map(g=>'<div class="item">'+esc(g.question)+'<div class="muted">'+esc(g.reason)+'</div></div>').join('')+'<div class="actions">'+(edit&&draft?'<button onclick="approve('+id+')">Approve handover</button>':'')+(h.status==='approved'?'<button class="ghost" onclick="downloadHandover('+id+')">Export Markdown</button><button onclick="ack('+id+')">'+(h.acknowledged?'Acknowledged':'Acknowledge receipt')+'</button>':'')+'</div></div>';el.scrollIntoView({block:'start'})}catch(e){msg(e.message,true)}}
async function reviewClaim(hid,id,verdict){let correction='';if(verdict==='correct'){correction=prompt('Enter corrected statement')||'';if(!correction)return}try{await api('/handovers/'+hid+'/review','POST',{claim_id:id,verdict,correction});await viewHandover(hid)}catch(e){msg(e.message,true)}}
async function approve(id){try{await api('/handovers/'+id+'/approve','POST',{});await go('handovers');await viewHandover(id);msg('Approved')}catch(e){msg(e.message,true)}}
async function ack(id){try{await api('/handovers/'+id+'/acknowledge','POST',{});await viewHandover(id);msg('Receipt acknowledged')}catch(e){msg(e.message,true)}}
async function downloadHandover(id){try{let r=await fetch('/api/handovers/'+id+'/export',{headers:{Authorization:'Bearer '+token}});if(!r.ok)throw Error(await r.text());let blob=await r.blob(),url=URL.createObjectURL(blob),a=document.createElement('a');a.href=url;a.download='handover-'+id+'.md';a.click();URL.revokeObjectURL(url)}catch(e){msg(e.message,true)}}

async function indexSource(id){try{msg('Indexing up to four document sections. Repeat to complete large documents.');let v=await api('/sources/'+id+'/index','POST',{});msg('Semantic index: '+v.indexed_total+' / '+v.total_chunks+' sections'+(v.complete?' · complete':' · click Build semantic index again'))}catch(e){msg('Semantic indexing unavailable: '+e.message,true)}}
async function decisionPage(){let target=document.querySelector('#content');target.innerHTML='<div class="panel"><h2>Decision DNA · Evidence timeline</h2><p class="muted">Only decisions traceable to documents you can access appear here. Missing dates or rationale are flagged rather than invented.</p><div id="decisionsList">Loading...</div></div>';try{let d=await api('/decisions');document.querySelector('#decisionsList').innerHTML=d.decisions.length?d.decisions.map((x,i)=>'<div class="item"><span class="badge">'+esc(x.date)+'</span><h3>Decision '+(i+1)+'</h3><p>'+esc(x.decision)+'</p><small>'+esc(x.source_name)+' · line '+x.line+'</small> <span class="badge">'+(x.rationale_recorded?'Rationale mentioned':'Rationale missing')+'</span><div class="actions"><button class="ghost" onclick="go(\'sources\').then(()=>viewSource('+x.source_id+'))">Inspect source</button></div></div>').join(''):'<p>No explicit decisions found. Upload notes containing decisions, or add evidence before generating a handover.</p>'}catch(e){msg(e.message,true)}}
async function setProgress(id,day,checked){try{await api('/handovers/'+id+'/progress','POST',{day,completed:checked});await showPlan(id)}catch(e){msg(e.message,true)}}

function onboardingPage(){let approved=handovers.filter(h=>h.status==='approved');document.querySelector('#content').innerHTML='<div class="panel"><h2>Seven-day continuation roadmap</h2><p>Select an approved handover to understand the project state and first actions.</p>'+(approved.length?approved.map(h=>'<button class="ghost" onclick="showPlan('+h.id+')">Handover #'+h.id+'</button>').join(' '):'<p>No approved handovers are available.</p>')+'<div id="plan"></div></div>'}
async function showPlan(id){try{let h=await api('/handovers/'+id);document.querySelector('#plan').innerHTML='<p><b>'+h.progress_percent+'% complete</b> · progress is saved for your account</p>'+h.onboarding.map(i=>'<div class="item"><label style="display:flex;gap:12px;align-items:flex-start;cursor:pointer"><input style="width:auto;margin-top:5px" type="checkbox" '+(i.completed?'checked':'')+' onchange="setProgress('+id+','+i.number+',this.checked)"><span><b>'+esc(i.day)+'</b><p>'+esc(i.description)+'</p></span></label></div>').join('')}catch(e){msg(e.message,true)}}
(async()=>{if(token){try{user=await api('/me');await refresh()}catch(e){token='';sessionStorage.removeItem('token')}}render()})();
</script></body></html>
